
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">

    <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;

            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <iframe
        src="https://findora-radm4xg9zuvryjx6izcbwm.streamlit.app/?embed=true"
        title="Findora AI Gallery Search"
        allow="camera; microphone">
    </iframe>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js")
                .then(() => console.log("Findora service worker registered"))
                .catch(error => console.error("Service worker error:", error));
        });
    }
</script>

</body>
</html>
