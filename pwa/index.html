<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EC">
  <meta name="description" content="Findora - search your photos by describing them">
  <title>Findora</title>
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root { --bg:#FBF6EC; --text:#2A2140; --muted:#6E6486; --accent:#7C3AED; --accent2:#0EA5E9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body { display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text);
      background:radial-gradient(700px 400px at 50% 20%, rgba(124,58,237,.16), transparent 65%), linear-gradient(180deg,#FBF6EC,#F1E6CF); }
    img { width:96px; height:96px; border-radius:24px; box-shadow:0 0 36px rgba(124,58,237,.4); }
    h1 { margin-top:18px; font-size:2rem; background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    p { margin-top:8px; color:var(--muted); }
    a.btn { display:inline-block; margin-top:22px; padding:12px 26px; border-radius:999px; color:#fff; text-decoration:none;
      font-weight:600; background:linear-gradient(135deg,var(--accent),#5b21b6); border:2px solid var(--accent2);
      box-shadow:0 8px 28px rgba(124,58,237,.35); }
    small { display:block; margin-top:14px; color:var(--muted); font-size:.8rem; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="Findora logo">
    <h1>Findora</h1>
    <p id="msg">Opening your app… the first start can take a minute.</p>
    <a class="btn" id="open" href="https://findora-radm4xg9zuvryjx6izcbwm.streamlit.app/">Open Findora</a>
    <small>If nothing happens, tap the button.</small>
  </main>
  <script>
    const APP_URL = "https://findora-radm4xg9zuvryjx6izcbwm.streamlit.app/";
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
    // Skip the auto-redirect with  ?stay  (useful for testing the install prompt)
    if (!location.search.includes("stay")) {
      setTimeout(() => location.replace(APP_URL), 1200);
    }
  </script>
</body>
</html>
